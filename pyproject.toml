[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "precision-md"
version = "0.1.0"
description = "Feasibility gates for adaptive precision molecular dynamics"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=16,<20",
  "pydantic>=2.7,<3", "PyYAML>=6,<7", "scipy>=1.12,<2",
  "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "zarr>=2.18,<3",
]

[project.optional-dependencies]
ml = ["torch==2.4.1", "mace-torch==0.3.16", "ase>=3.23,<4", "ase-db-backends>=0.10"]
test = ["pytest>=8,<9", "hypothesis>=6,<7"]

[project.scripts]
precision-md = "precision_md.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/precision_md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
